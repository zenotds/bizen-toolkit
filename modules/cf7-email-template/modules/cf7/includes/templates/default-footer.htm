					</td>
				</tr>

				<!-- Dati aziendali -->
				<tr>
					<td class="mail-footer mail-pad" bgcolor="#2f2f2f" style="background-color:#2f2f2f; padding:28px 32px; font-family:Helvetica,Arial,sans-serif; font-size:12px; line-height:1.7; color:#ffffff;">
						<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
							<tr>
								<td class="mail-stack" valign="top" width="55%" style="font-family:Helvetica,Arial,sans-serif; font-size:12px; line-height:1.7; color:#ffffff;">
									<strong style="text-transform:uppercase; letter-spacing:.02em;">[company_name]</strong><br>
									[company_address]<br>
									[company_zip] [company_city] ([company_state]) &ndash; [company_country]
								</td>
								<td class="mail-stack" valign="top" width="45%" align="right" style="font-family:Helvetica,Arial,sans-serif; font-size:12px; line-height:1.7; color:#ffffff;">
									Tel. [company_phone]<br>
									<a href="mailto:[company_email]" style="color:#ffffff; text-decoration:none;">[company_email]</a><br>
									<a href="[home_url]" style="color:#ffffff; text-decoration:none;">[site_domain]</a>
								</td>
							</tr>
							<tr>
								<td colspan="2" style="padding-top:16px; font-family:Helvetica,Arial,sans-serif; font-size:11px; line-height:1.6; color:#ffffff;">
									<span style="opacity:.75;">P.IVA [company_vat] &ndash; REA [company_rea]</span>
								</td>
							</tr>
						</table>
					</td>
				</tr>

			</table>

			<!-- Nota, fuori dal riquadro -->
			<table role="presentation" class="mail-shell" width="600" border="0" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px;">
				<tr>
					<td align="center" class="mail-pad" style="padding:16px 32px 0; font-family:Helvetica,Arial,sans-serif; font-size:11px; line-height:1.6; color:#8a8a8a;">
						[mail_note]
					</td>
				</tr>
			</table>

		</td>
	</tr>
</table>
